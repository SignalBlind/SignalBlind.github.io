# Site settings
title: Signal Blind
description: My experience as a signal blind person -- I do not have any social salience (a-salient)
baseurl: ""
url: "https://www.signalblind.org"

permalink: pretty

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 1..3

# Exclude from processing
# Note: tags not used right now so exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - README.md
  - LICENSE
  - tools
  - JEKYLL.md
  - tags/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-last-modified-at
  - jekyll-relative-links

# Relative links configuration
relative_links:
  enabled: true
  collections: false

# Feed settings
feed:
  path: feed.xml

# Pages to exclude from RSS feed and Recently Updated
exclude_from_updates:
  - google38ed2014273d2f3d.html
  - /tags/
  - /recent/
  - /glossary/
  - /print-export.html
  - /sitemap.xml
  - /feed.xml
  - /robots.txt
  - /assets/
  - search-data.json

# Pages to exclude from print export
exclude_from_print:
  - google38ed2014273d2f3d.html
  - /tags/
  - /recent/
  - /feed.xml
  - /glossary.md
  - /assets/
  - /_sass/
  - /robots.txt
  - /search-data.json

# Pages to exclude from sidebar navigation
exclude_from_nav:
  - /feed.xml
  - /assets/
  - /robots.txt
  - /search-data.json

# Navigation
navigation:
  - title: Home
    url: /
  - title: About Me
    url: /Experience/
  - title: Emotions
    url: /Emotions/
  - title: Cognitive Architecture
    url: /Cognition/

# Footer navigation
footer_navigation:
  - title: GitHub
    url: https://github.com/SignalBlind/SignalBlind.github.io
  - title: Privacy
    url: /privacy/
  - title: RSS Feed
    url: /feed.xml
