- term: Autism
  alternates:
    - ASD
    - Autistic
  full: Autism Spectrum Disorder
  definition: A developmental condition affecting communication and behavior, characterized by challenges with social skills, repetitive behaviors, and communication differences. [Wikipedia](https://en.wikipedia.org/wiki/Autism)

- term: Social Salience
  alternates:
    - Social Saliency
    - Salience Network
  definition: I am really referring to the Salience Network -- a low level part of the brain that processes social signals and gives importance to the same. [Wikipedia](https://en.wikipedia.org/wiki/Salience_network)

- term: A-Salience
  full: Lack of Social Salience
  definition: The _experience_ of not being noticed or remembered in social contexts. People who are a-salient may be overlooked in groups, forgotten after interactions, or find their contributions attributed to others.

- term: Signal Blind
  definition: A term describing individuals who lack social salience. Similar to being "invisible" in social situations, where others don't naturally register or remember your presence.
